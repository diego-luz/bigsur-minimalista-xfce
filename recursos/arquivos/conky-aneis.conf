-- Widget "aneis" da area de trabalho, adaptado do MX-CoreBlue (MX Linux) que
-- aparece no setup Xfce Big Sur do lsteam. Os aneis sao desenhados pelo
-- d3bian-aneis.lua; as posicoes do texto abaixo acompanham as dele.
-- Recarregue com:
--   pkill conky; conky -c ~/.config/conky/d3bian-aneis.conf &
conky.config = {
    alignment = 'top_right',
    gap_x = 30, gap_y = 50,
    minimum_width = 280, maximum_width = 280,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    draw_shades = false, draw_outline = false, draw_borders = false,
    use_xft = true,
    font = '@@fonte_ui@@:size=8',
    xftalpha = 1,
    override_utf8_locale = true,
    update_interval = 1.0,
    total_run_times = 0,
    no_buffers = true,
    text_buffer_size = 2048,
    cpu_avg_samples = 2, net_avg_samples = 2,
    if_up_strictness = 'address',
    temperature_unit = 'celsius',
    default_color = 'ffffff', color0 = 'ffffff', color1 = '@@widget_cor@@',
    lua_load = '@@HOME@@/.config/conky/d3bian-aneis.lua',
    lua_draw_hook_pre = 'aneis',
}

conky.text = [[
${voffset 4}${color1}${font @@fonte_ui@@:size=16}${time %A}${font}${color}${alignr}${font @@fonte_ui@@:bold:size=38}${voffset -14}${time %d}${font}
${voffset -28}${font @@fonte_ui@@:size=16}${time %b}${font} ${font @@fonte_ui@@:size=18}${time %Y}${font}
${voffset 44}${goto 216}${if_existing /sys/class/power_supply/BAT0}${battery_percent BAT0}%${else}--${endif}
${voffset 24}${goto 212}${color1}Bateria${color}
${voffset 92}${goto 20}Ligado há ${uptime_short}
${color1}${hr 1}${color}
${voffset 4}${color1}Temperatura:${color} ${acpitemp}°C
${voffset 4}${color1}Processos:${color} ${processes}${goto 152}${cpu cpu1}%${goto 227}${cpu cpu2}%
${voffset 4}${color1}Em execução:${color} ${running_processes}${goto 152}${color1}CPU1${goto 227}CPU2${color}
${voffset 4}${color1}Frequência:${color} ${freq_g} GHz
${voffset 4}${color1}Carga:${color} ${loadavg}
${voffset 4}${color1}${hr 1}${color}
${voffset 2}${color1}Computador:${color}${alignr}${nodename}
${lua_parse rede}
${voffset 4}${color1}${hr 1}${color}
${voffset 30}${goto 28}${fs_used_perc /}%${goto 128}${memperc}%${goto 228}${swapperc}%
${voffset 4}${goto 26}${color1}Disco${goto 129}RAM${goto 226}Troca${color}
${voffset 24}${color1}${hr 1}${color}
${voffset 2}${color1}PROGRAMA${goto 142}PID${goto 188}CPU%${goto 238}MEM%${color}
${top name 1}${goto 136}${top pid 1}${goto 186}${top cpu 1}${goto 236}${top mem 1}
${top name 2}${goto 136}${top pid 2}${goto 186}${top cpu 2}${goto 236}${top mem 2}
${top name 3}${goto 136}${top pid 3}${goto 186}${top cpu 3}${goto 236}${top mem 3}
${top name 4}${goto 136}${top pid 4}${goto 186}${top cpu 4}${goto 236}${top mem 4}
${top name 5}${goto 136}${top pid 5}${goto 186}${top cpu 5}${goto 236}${top mem 5}
${voffset 4}${color1}${hr 1}${color}
${voffset 2}${color1}Sistema:${color}${alignr}${lua sistema}
${color1}Kernel:${color}${alignr}${kernel}
]]
