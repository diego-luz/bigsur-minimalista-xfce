-- Widget leve da area de trabalho. Para gastar menos processador, aumente o
-- update_interval. Recarregue com:
--   pkill conky; conky -c ~/.config/conky/d3bian.conf &
conky.config = {
    alignment = 'top_right',
    gap_x = 40, gap_y = 60,
    minimum_width = 260, maximum_width = 260,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    draw_shades = false, draw_outline = false, draw_borders = false,
    use_xft = true,
    font = '@@fonte_ui@@:size=10',
    xftalpha = 1,
    override_utf8_locale = true,
    update_interval = 2.0,
    total_run_times = 0,
    no_buffers = true,
    cpu_avg_samples = 2, net_avg_samples = 2,
    default_color = 'ffffff', color1 = 'ffffff', color2 = 'c8c8c8',
}

conky.text = [[
${alignr}${font @@fonte_ui@@:bold:size=44}${time %H:%M}${font}
${alignr}${color2}${time %A, %d de %B}${color}
${voffset 14}
${color2}CPU${color}${alignr}${cpu cpu0}%
${cpubar 4}
${color2}Memoria${color}${alignr}${mem} / ${memmax}
${membar 4}
${color2}Disco /${color}${alignr}${fs_used /} / ${fs_size /}
${fs_bar 4 /}
${voffset 8}
${color2}Rede${color}${alignr}${downspeedf}  ${upspeedf} KB/s
${voffset 8}
${color2}Ligado ha${color}${alignr}${uptime_short}
]]
