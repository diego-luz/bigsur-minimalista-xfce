# picom do d3bian-init-bigsur-minimalista-xfce (picom 12.5 do Debian 13).
#
# Escrito pela receita de efeitos com a opcao "efeitos" e o que a maquina aguenta:
# mudar aqui some no proximo Aplicar. Enquanto o picom roda, o compositor do
# proprio xfwm4 fica desligado (xfwm4 /general/use_compositing).
# Situacao: @@picom_aviso@@

backend = "@@picom_backend@@";
vsync = @@picom_vsync@@;
use-damage = true;
log-level = "warn";

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = false;

# cantos: o mesmo raio das ilhas, para o desfoque nao vazar
corner-radius = @@raio@@;
rounded-corners-exclude = [
@@picom_excluir_barra@@
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "_GTK_FRAME_EXTENTS@"
];

# sombras
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.32;
shadow-offset-x = -16;
shadow-offset-y = -12;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "_GTK_FRAME_EXTENTS@"
];

# desfoque atras do que e translucido (ilhas, terminal)
@@picom_desfoque@@

# transparencia de janelas
frame-opacity = 1.0;
inactive-opacity = 1.0;
inactive-opacity-override = false;
@@picom_opacidade@@

# abrir e fechar com um esmaecer curto
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;
no-fading-openclose = false;

wintypes: {
  tooltip = { fade = true; shadow = false; full-shadow = false; };
  dock = { shadow = true; clip-shadow-above = true; };
  dnd = { shadow = false; };
};
