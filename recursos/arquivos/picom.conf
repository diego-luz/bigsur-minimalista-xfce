backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;

# --- cantos arredondados -------------------------------------------------
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Xfce4-panel'",
  "class_g = 'Conky'"
];

# --- sombras -------------------------------------------------------------
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.32;
shadow-offset-x = -18;
shadow-offset-y = -12;
shadow-exclude = [
  "class_g = 'Conky'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@",
  "_NET_WM_STATE@[0]*= '_NET_WM_STATE_HIDDEN'"
];

# --- transicoes ----------------------------------------------------------
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
fade-exclude = [ "class_g = 'Conky'" ];

# --- transparencia -------------------------------------------------------
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
  "88:class_g = 'Rofi'"
];

# --- desfoque (desligado por padrao nesta GPU) ---------------------------
# Para ativar o efeito de vidro do macOS, troque para "dual_kawase".
blur-method = "none";
blur-strength = 5;
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Conky'",
  "_GTK_FRAME_EXTENTS@"
];

# --- diversos ------------------------------------------------------------
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = true;

wintypes:
{
  tooltip      = { fade = true; shadow = true; opacity = 0.95; focus = true; };
  dock         = { shadow = true; };
  dnd          = { shadow = false; };
  popup_menu   = { shadow = true; opacity = 0.96; };
  dropdown_menu= { shadow = true; opacity = 0.96; };
};
