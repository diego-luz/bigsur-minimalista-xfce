[modulo]
id = "10"
nome = "pacotes"
titulo = "Pacotes do repositorio Debian"
afetada_por = []

[[passo]]
tipo = "comando"
dizer = "atualizando o indice do apt"
root = true
tolera_falha = true
argumentos = ["apt-get", "update"]

[[passo]]
tipo = "apt"
dizer = "ferramentas para montar os temas"
pacotes = ["git", "curl", "wget", "gpg", "jq", "unzip", "sassc", "libglib2.0-dev-bin",
           "libxml2-utils", "imagemagick", "optipng", "dialog", "x11-utils"]

[[passo]]
tipo = "apt"
dizer = "motores graficos que o tema precisa"
pacotes = ["gtk2-engines-murrine", "gnome-themes-extra", "libglib2.0-bin"]

# o xfce4-panel-profiles do Debian nao puxa o python3-gi, sem o qual ele nem abre
[[passo]]
tipo = "apt"
dizer = "componentes do desktop"
pacotes = ["xfce4-panel-profiles", "python3-gi", "xfce4-whiskermenu-plugin", "xfce4-screenshooter"]

# o convert so le o logo em svg (a foto da tela de login) pelo rsvg-convert:
# instalado sem os recomendados, o imagemagick nao traz quem leia svg
[[passo]]
tipo = "apt"
dizer = "tela de login e fontes"
pacotes = ["lightdm-gtk-greeter", "librsvg2-bin", "light-locker", "fonts-inter", "fonts-firacode", "fonts-noto-color-emoji"]
