[modulo]
id = "31"
nome = "icones"
titulo = "Icones WhiteSur"
requer = ["10"]

# commit fixo (o master de 2026-10-06): o que roda e o que foi conferido. Para
# atualizar: git ls-remote https://github.com/vinceliuice/WhiteSur-icon-theme.git master
[[passo]]
tipo = "git"
url = "https://github.com/vinceliuice/WhiteSur-icon-theme.git"
ref = "73d8040da51a9ed74e47c7366e7e9ff437601a5c"
destino = "@@fontes@@/WhiteSur-icon-theme"

[[passo]]
tipo = "script"
dizer = "instalando os icones"
corpo = '''
cd "$D3_FONTES/WhiteSur-icon-theme"
d3_pasta "$HOME/.local/share/icons"
d3_antes "$HOME/.local/share/icons/WhiteSur" "$HOME/.local/share/icons/WhiteSur-dark" \
         "$HOME/.local/share/icons/WhiteSur-light"
bash ./install.sh -t default -a -b
# o WhiteSur busca no breeze o que nao tem, mas o breeze nao vem no XFCE e
# o icone some; o Adwaita e dependencia do GTK e esta sempre instalado
for t in "$HOME/.local/share/icons/WhiteSur" \
         "$HOME/.local/share/icons/WhiteSur-dark" \
         "$HOME/.local/share/icons/WhiteSur-light"; do
  [ -f "$t/index.theme" ] || continue
  sed -i 's/^Inherits=.*/Inherits=hicolor,Adwaita/' "$t/index.theme"
done
for t in "$HOME/.local/share/icons/WhiteSur" \
         "$HOME/.local/share/icons/WhiteSur-dark" \
         "$HOME/.local/share/icons/WhiteSur-light"; do
  [ -d "$t" ] || continue
  d3_antes "/usr/share/icons/$(basename "$t")"
  sudo -n rm -rf "/usr/share/icons/$(basename "$t")" 2>/dev/null || true
  sudo -n cp -a "$t" /usr/share/icons/ 2>/dev/null || true
done
gtk-update-icon-cache -f "$HOME/.local/share/icons/WhiteSur" >/dev/null 2>&1 || true
echo "icones instalados"
'''
