[modulo]
id = "32"
nome = "cursores"
titulo = "Cursores WhiteSur"
requer = ["10"]

# commit fixo (o master de 2026-10-06): o que roda e o que foi conferido. Para
# atualizar: git ls-remote https://github.com/vinceliuice/WhiteSur-cursors.git master
[[passo]]
tipo = "git"
url = "https://github.com/vinceliuice/WhiteSur-cursors.git"
ref = "e190baf618ed95ee217d2fd45589bd309b37672b"
destino = "@@fontes@@/WhiteSur-cursors"

[[passo]]
tipo = "script"
dizer = "instalando os cursores"
corpo = '''
origem=""
# o repositorio entrega a arvore pronta em dist/, com index.theme, nao cursor.theme
for c in "$D3_FONTES/WhiteSur-cursors/dist" "$D3_FONTES/WhiteSur-cursors/dist/WhiteSur-cursors"; do
  if [ -f "$c/index.theme" ] && [ -d "$c/cursors" ]; then origem="$c"; break; fi
done
[ -n "$origem" ] || { echo "nao achei a pasta de cursores"; exit 1; }
d3_antes "$HOME/.local/share/icons/WhiteSur-cursors" /usr/share/icons/WhiteSur-cursors
rm -rf "$HOME/.local/share/icons/WhiteSur-cursors"
mkdir -p "$HOME/.local/share/icons"
cp -a "$origem" "$HOME/.local/share/icons/WhiteSur-cursors"
sudo -n rm -rf /usr/share/icons/WhiteSur-cursors 2>/dev/null || true
sudo -n cp -a "$origem" /usr/share/icons/WhiteSur-cursors 2>/dev/null || true
echo "cursores instalados"
'''

# ~/.icons costuma nao existir; se o projeto criar, sai no desfazer quando ficar vazia
[[passo]]
tipo = "script"
corpo = '''
d3_pasta "$HOME/.icons"
'''

[[passo]]
tipo = "arquivo"
destino = "~/.icons/default/index.theme"
modelo = "cursor-default.theme"
