chave = "/Net/ThemeName"
valor = "@@gtk_tema@@"

[[passo]]
tipo = "xfconf"
canal = "xsettings"
chave = "/Net/IconThemeName"
valor = "@@icones@@"

[[passo]]
tipo = "xfconf"
canal = "xsettings"
chave = "/Gtk/CursorThemeName"
valor = "@@cursores@@"

[[passo]]
tipo = "xfconf"
canal = "xsettings"
chave = "/Gtk/CursorThemeSize"
tipo_valor = "int"
valor = "24"

[[passo]]
tipo = "xfconf"
canal = "xsettings"
chave = "/Gtk/FontName"
valor = "@@fonte_ui@@ 10"

[[passo]]
tipo = "xfconf"
canal = "xsettings"
chave = "/Gtk/MonospaceFontName"
valor = "@@fonte_mono@@ 10"

# botoes da janela a direita, preferencia do usuario; no macOS ficam a esquerda
[[passo]]
tipo = "xfconf"
canal = "xsettings"
chave = "/Gtk/DecorationLayout"
valor = ":minimize,maximize,close"

[[passo]]
tipo = "xfconf"
canal = "xsettings"
chave = "/Xft/HintStyle"
valor = "hintslight"

[[passo]]
tipo = "xfconf"
canal = "xsettings"
chave = "/Xft/RGBA"
valor = "rgb"

[[passo]]
tipo = "xfconf"
dizer = "ajustando o gerenciador de janelas"
canal = "xfwm4"
chave = "/general/theme"
valor = "@@gtk_tema@@"

# com o encaixe ligado o 44 troca o tema acima pela copia de bordas largas;
# se so esta receita rodar de novo, a copia e refeita aqui
[[passo]]
tipo = "script"
se = "janelas == sim"
tolera_falha = true
corpo = '''
b="$HOME/.local/bin/d3bian-bordas"
[ -x "$b" ] || exit 0
d3_antes "$HOME/.themes/$D3_GTK_TEMA-bordas"
novo=$("$b" "$D3_GTK_TEMA" 4)
d3_xfconf xfwm4 /general/theme string
xfconf-query -c xfwm4 -p /general/theme -s "$novo"
'''

[[passo]]
tipo = "xfconf"
canal = "xfwm4"
chave = "/general/button_layout"
valor = "|HMC"

[[passo]]
tipo = "xfconf"
canal = "xfwm4"
chave = "/general/title_alignment"
valor = "center"

[[passo]]
tipo = "xfconf"
canal = "xfwm4"
chave = "/general/title_font"
valor = "@@fonte_ui@@ Bold 9"

[[passo]]
tipo = "xfconf"
canal = "xfwm4"
chave = "/general/workspace_count"
tipo_valor = "int"
valor = "4"

[[passo]]
tipo = "arquivo"
dizer = "arquivos de tema para programas que nao leem o xsettings"
destino = "~/.config/gtk-3.0/settings.ini"
modelo = "gtk3-settings.ini"

# GTK 2: um bloco marcado no ~/.gtkrc-2.0, que o desfazer tira (e apaga o
# arquivo se ele so existia pelo projeto). A versao anterior escrevia o arquivo
# inteiro com estas mesmas linhas, sem marca; esse arquivo sai antes, e o
# diario dele (copia de antes, ou criado) continua valendo no desfazer
[[passo]]
tipo = "script"
corpo = '''
f="$HOME/.gtkrc-2.0"
[ -f "$f" ] && [ ! -L "$f" ] || exit 0
grep -qxF "# d3bian-init-minimalista" "$f" && exit 0
linhas=$(grep -c . "$f" || true)
nossas=$(grep -cxE 'gtk-(theme|icon-theme|cursor-theme|font)-name="[^"]*"|gtk-cursor-theme-size=[0-9]+' "$f" || true)
# so o que o diario diz que o projeto escreveu (um arquivo da pessoa com as
# mesmas linhas fica)
escrito=$(ARQ="$f" PYTHONPATH="$D3_DIARIO_PAI" "$D3_DIARIO_PYTHON" -c '
import importlib, os
d = importlib.import_module(os.environ["D3_DIARIO_PACOTE"] + ".diario")
print("sim" if any(i.get("tipo") in ("criado", "alterado") and i.get("caminho") == os.environ["ARQ"]
                   for i in d.ler()) else "nao")
')
if [ "$escrito" = sim ] && [ "$linhas" -gt 0 ] && [ "$linhas" = "$nossas" ]; then
  d3_antes "$f"
  rm -f "$f"
  echo "~/.gtkrc-2.0 da versao anterior trocado por um bloco marcado"
fi
'''

[[passo]]
tipo = "bloco"
destino = "~/.gtkrc-2.0"
comentario = "#"
marca = "d3bian-init-minimalista"
conteudo = '''
gtk-theme-name="@@gtk_tema@@"
gtk-icon-theme-name="@@icones@@"
gtk-cursor-theme-name="@@cursores@@"
gtk-cursor-theme-size=24
gtk-font-name="@@fonte_ui@@ 10"
'''

# o valor de antes das tres chaves abaixo, para o desfazer
[[passo]]
tipo = "script"
tolera_falha = true
corpo = '''
for chave in color-scheme gtk-theme icon-theme; do d3_gsettings org.gnome.desktop.interface "$chave"; done
'''

# apps libadwaita, o seletor de arquivos do portal e o Firefox leem estas
# chaves e nao o xsettings; sem elas abrem claros mesmo no tema escuro
[[passo]]
tipo = "comando"
dizer = "avisando os apps GTK4 e o portal que o tema e @@tema@@"
tolera_falha = true
argumentos = ["gsettings", "set", "org.gnome.desktop.interface", "color-scheme", "@@gtk_esquema@@"]

[[passo]]
tipo = "comando"
tolera_falha = true
argumentos = ["gsettings", "set", "org.gnome.desktop.interface", "gtk-theme", "@@gtk_tema@@"]

[[passo]]
tipo = "comando"
tolera_falha = true
argumentos = ["gsettings", "set", "org.gnome.desktop.interface", "icon-theme", "@@icones@@"]

[[passo]]
tipo = "script"
dizer = "ligando o tema ao GTK4, que so le ~/.config/gtk-4.0"
tolera_falha = true
corpo = '''
# a variante com a cor pode nao ter sido gerada; a base sempre existe
origem="$HOME/.themes/$D3_GTK_TEMA/gtk-4.0"
[ -d "$origem" ] || origem="$HOME/.themes/$D3_GTK_TEMA_BASE/gtk-4.0"
if [ ! -d "$origem" ]; then
  echo "atencao: $origem nao existe, o GTK4 fica com o tema padrao"
  exit 1
fi
mkdir -p "$HOME/.config/gtk-4.0"
for f in assets gtk.css gtk-dark.css; do
  alvo="$HOME/.config/gtk-4.0/$f"
  # so troca link ou arquivo; uma pasta de verdade ali e do usuario
  if [ -d "$alvo" ] && [ ! -L "$alvo" ]; then
    echo "mantendo $alvo, que nao e um link"
    continue
  fi
  d3_antes "$alvo"
  ln -sfn "$origem/$f" "$alvo"
done
echo "GTK4 usando $(dirname "$origem" | xargs basename)"
'''

[[passo]]
tipo = "script"
dizer = "papel de parede"
tolera_falha = true
corpo = '''
# o caminho ja vem resolvido pelo motor; vazio quer dizer "nao mexer"
if [ -z "$D3_PAPEL_ARQUIVO" ]; then
  echo "mantendo o papel de parede que voce escolheu"
else
  for p in $(xfconf-query -c xfce4-desktop -l | grep -E 'last-image$'); do
    d3_xfconf xfce4-desktop "$p" string
    xfconf-query -c xfce4-desktop -p "$p" -s "$D3_PAPEL_ARQUIVO"
  done
  # a chave do monitor atual pode ainda nao existir
  for mon in $(xrandr --query 2>/dev/null | awk '/ connected/{print $1}'); do
    chave="/backdrop/screen0/monitor$mon/workspace0/last-image"
    d3_xfconf xfce4-desktop "$chave" string
    d3_xfconf xfce4-desktop "/backdrop/screen0/monitor$mon/workspace0/image-style" int
    xfconf-query -c xfce4-desktop -p "$chave" -n -t string -s "$D3_PAPEL_ARQUIVO" 2>/dev/null \
      || xfconf-query -c xfce4-desktop -p "$chave" -s "$D3_PAPEL_ARQUIVO" 2>/dev/null || true
    xfconf-query -c xfce4-desktop -p "/backdrop/screen0/monitor$mon/workspace0/image-style" \
      -n -t int -s 5 2>/dev/null || true
  done
  echo "papel de parede: $(basename "$D3_PAPEL_ARQUIVO")"
fi
# o xfdesktop nao repinta sozinho quando a chave muda por fora da interface
xfdesktop --reload >/dev/null 2>&1 || true
'''
