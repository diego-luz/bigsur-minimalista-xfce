[modulo]
id = "44"
nome = "janelas"
titulo = "Encaixe e atalhos de janela"
afetada_por = ["janelas"]

[[passo]]
tipo = "script"
se = "janelas != sim"
dizer = "removendo os atalhos de encaixe"
tolera_falha = true
corpo = '''
for k in '<Super>Left' '<Super>Right' '<Super>Up' '<Super>Down' \
         '<Super>1' '<Super>2' '<Super>3' '<Super>4' '<Super>f'; do
  xfconf-query -c xfce4-keyboard-shortcuts -p "/xfwm4/custom/$k" -r 2>/dev/null || true
done
for k in '<Super>c' '<Super>x' '<Super><Shift>Left' '<Super><Shift>Right'; do
  xfconf-query -c xfce4-keyboard-shortcuts -p "/commands/custom/$k" -r 2>/dev/null || true
done
rm -f "$HOME/.local/bin/d3bian-janelas"
echo "atalhos de janela removidos"
'''

[[passo]]
tipo = "apt"
se = "janelas == sim"
pacotes = ["wmctrl", "xdotool", "x11-utils"]

[[passo]]
tipo = "copiar"
se = "janelas == sim"
origem = "@@arquivos@@/janelas.sh"
destino = "~/.local/bin/d3bian-janelas"

[[passo]]
tipo = "comando"
se = "janelas == sim"
tolera_falha = true
argumentos = ["chmod", "755", "@@HOME@@/.local/bin/d3bian-janelas"]

# metades e quartos sao do proprio xfwm4; o script cobre so o que ele nao faz
[[passo]]
tipo = "script"
se = "janelas == sim"
dizer = "afinando o encaixe e definindo os atalhos"
corpo = '''
set_wm(){ xfconf-query -c xfwm4 -p "$1" -n -t "$2" -s "$3" 2>/dev/null \
          || xfconf-query -c xfwm4 -p "$1" -s "$3"; }
set_wm /general/snap_to_border  bool true
set_wm /general/snap_to_windows bool true
set_wm /general/snap_width      int  12
set_wm /general/tile_on_move    bool true
set_wm /general/easy_click      string Alt
set_wm /general/cycle_preview   bool true

atalho(){ xfconf-query -c xfce4-keyboard-shortcuts -p "$1" -n -t string -s "$2" 2>/dev/null \
          || xfconf-query -c xfce4-keyboard-shortcuts -p "$1" -s "$2"; }
atalho '/xfwm4/custom/<Super>Left'  tile_left_key
atalho '/xfwm4/custom/<Super>Right' tile_right_key
atalho '/xfwm4/custom/<Super>Up'    maximize_window_key
atalho '/xfwm4/custom/<Super>Down'  hide_window_key
atalho '/xfwm4/custom/<Super>f'     fullscreen_key
atalho '/xfwm4/custom/<Super>1'     tile_up_left_key
atalho '/xfwm4/custom/<Super>2'     tile_up_right_key
atalho '/xfwm4/custom/<Super>3'     tile_down_left_key
atalho '/xfwm4/custom/<Super>4'     tile_down_right_key
j="$HOME/.local/bin/d3bian-janelas"
atalho '/commands/custom/<Super>c'            "$j centro"
atalho '/commands/custom/<Super>x'            "$j quase-cheia"
atalho '/commands/custom/<Super><Shift>Left'  "$j 2-3-esquerda"
atalho '/commands/custom/<Super><Shift>Right' "$j 1-3-direita"
echo "Super e setas para metades, Super e 1 a 4 para quartos, Super+C centraliza"
'''
