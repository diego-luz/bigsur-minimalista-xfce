[modulo]
id = "50"
nome = "menu-global"
titulo = "Barra de menus do programa ativo"
afetada_por = ["menu_global"]

[[passo]]
tipo = "script"
se = "menu_global != sim"
dizer = "desligando o menu global"
tolera_falha = true
corpo = '''
xfconf-query -c xsettings -p /Gtk/ShellShowsMenubar -s false 2>/dev/null || true
xfconf-query -c xsettings -p /Gtk/ShellShowsAppmenu -s false 2>/dev/null || true
rm -f "$HOME/.config/environment.d/50-appmenu.conf" "$HOME/.config/xfce4/appmenu.sh"
sed -i '/d3bian-init: menu global/,+1d' "$HOME/.xprofile" 2>/dev/null || true
echo "menu global desligado; o efeito completo vem depois de reiniciar a sessao"
'''

[[passo]]
tipo = "apt"
se = "menu_global == sim"
pacotes = ["xfce4-appmenu-plugin", "appmenu-gtk3-module", "appmenu-registrar",
           "vala-panel-appmenu-common", "libdbusmenu-gtk3-4", "libdbusmenu-glib4"]

[[passo]]
tipo = "xfconf"
se = "menu_global == sim"
canal = "xsettings"
chave = "/Gtk/ShellShowsMenubar"
tipo_valor = "bool"
valor = "true"

[[passo]]
tipo = "xfconf"
se = "menu_global == sim"
canal = "xsettings"
chave = "/Gtk/ShellShowsAppmenu"
tipo_valor = "bool"
valor = "true"

[[passo]]
tipo = "copiar"
se = "menu_global == sim"
origem = "@@arquivos@@/appmenu.sh"
destino = "~/.config/xfce4/appmenu.sh"

[[passo]]
tipo = "script"
se = "menu_global == sim"
dizer = "carregando o modulo GTK no inicio da sessao"
corpo = '''
chmod +x "$HOME/.config/xfce4/appmenu.sh"
mkdir -p "$HOME/.config/environment.d"
printf 'GTK_MODULES=appmenu-gtk-module\nUBUNTU_MENUPROXY=1\n' \
  > "$HOME/.config/environment.d/50-appmenu.conf"
touch "$HOME/.xprofile"
grep -q 'xfce4/appmenu.sh' "$HOME/.xprofile" 2>/dev/null || \
  printf '\n# d3bian-init: menu global\n. "$HOME/.config/xfce4/appmenu.sh"\n' >> "$HOME/.xprofile"
echo "menu global pronto; ele so lista os menus depois de reiniciar a sessao"
'''
