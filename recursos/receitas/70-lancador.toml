[modulo]
id = "70"
nome = "lancador"
titulo = "Lancador de programas, estilo Spotlight"
requer = ["10"]

[[passo]]
tipo = "git"
url = "https://github.com/adi1090x/rofi.git"
ref = "master"
destino = "@@fontes@@/rofi-temas"

[[passo]]
tipo = "script"
dizer = "instalando os temas do lancador"
corpo = '''
origem="$D3_FONTES/rofi-temas"
mkdir -p "$HOME/.config/rofi" "$HOME/.local/share/fonts" "$HOME/.local/bin"
if [ -d "$origem/files" ]; then
  cp -rf "$origem/files/." "$HOME/.config/rofi/"
else
  cp -rf "$origem"/launchers "$origem"/applets "$origem"/colors "$HOME/.config/rofi/" 2>/dev/null || true
fi
[ -d "$origem/fonts" ] && cp -rf "$origem/fonts/." "$HOME/.local/share/fonts/" && \
  fc-cache -f "$HOME/.local/share/fonts" >/dev/null 2>&1 || true
chmod -R +x "$HOME/.config/rofi"/launchers/*/*.sh 2>/dev/null || true
chmod -R +x "$HOME/.config/rofi"/applets/*/*.sh 2>/dev/null || true

escolhido=""
for c in "$HOME/.config/rofi/launchers/type-2/launcher.sh" \
         "$HOME/.config/rofi/launchers/type-1/launcher.sh"; do
  [ -f "$c" ] && escolhido="$c" && break
done
[ -n "$escolhido" ] || escolhido="$(find "$HOME/.config/rofi/launchers" -name launcher.sh 2>/dev/null | sort | sed -n 1p)"

if [ -n "$escolhido" ]; then
  sed -i "s/^theme=.*/theme='style-1'/" "$escolhido" 2>/dev/null || true
  printf '#!/bin/sh\n# lancador de programas (Super+Espaco)\nexec "%s" "$@"\n' "$escolhido" \
    > "$HOME/.local/bin/d3bian-lancador"
else
  printf '#!/bin/sh\nexec rofi -show drun -show-icons\n' > "$HOME/.local/bin/d3bian-lancador"
fi
chmod 755 "$HOME/.local/bin/d3bian-lancador"
echo "lancador pronto: Super+Espaco"
'''
