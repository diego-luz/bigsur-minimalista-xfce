[modulo]
id = "80"
nome = "widget"
titulo = "Widget de relogio e status na area de trabalho"
afetada_por = ["widget", "fonte_interface", "destaque"]

# widget: sim e o simples, aneis e o adaptado do MX-CoreBlue, nao desliga

[[passo]]
tipo = "processo"
se = "widget == nao"
nome = "conky"
acao = "parar"

[[passo]]
tipo = "autostart"
se = "widget == nao"
id = "conky"
remover = true

[[passo]]
tipo = "apt"
se = "widget != nao"
pacotes = ["conky-all"]

# --- simples ---------------------------------------------------------------

[[passo]]
tipo = "arquivo"
se = "widget == sim"
destino = "~/.config/conky/d3bian.conf"
modelo = "conky.conf"

[[passo]]
tipo = "autostart"
se = "widget == sim"
id = "conky"
nome = "Widget da area de trabalho"
comando = "conky -c @@HOME@@/.config/conky/d3bian.conf"

[[passo]]
tipo = "processo"
se = "widget == sim"
nome = "conky"
acao = "reiniciar"
argumentos = ["conky", "-c", "@@HOME@@/.config/conky/d3bian.conf"]

# --- aneis -----------------------------------------------------------------

[[passo]]
tipo = "arquivo"
se = "widget == aneis"
destino = "~/.config/conky/d3bian-aneis.lua"
modelo = "conky-aneis.lua"

[[passo]]
tipo = "arquivo"
se = "widget == aneis"
destino = "~/.config/conky/d3bian-aneis.conf"
modelo = "conky-aneis.conf"

[[passo]]
tipo = "autostart"
se = "widget == aneis"
id = "conky"
nome = "Widget da area de trabalho"
comando = "conky -c @@HOME@@/.config/conky/d3bian-aneis.conf"

[[passo]]
tipo = "processo"
se = "widget == aneis"
nome = "conky"
acao = "reiniciar"
argumentos = ["conky", "-c", "@@HOME@@/.config/conky/d3bian-aneis.conf"]
