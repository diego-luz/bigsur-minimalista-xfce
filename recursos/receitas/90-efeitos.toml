[modulo]
id = "90"
nome = "efeitos"
titulo = "Sombras, cantos arredondados e transparencia"
afetada_por = ["efeitos"]

[[passo]]
tipo = "processo"
se = "efeitos != sim"
nome = "picom"
acao = "parar"

[[passo]]
tipo = "autostart"
se = "efeitos != sim"
id = "picom"
remover = true

# sem o picom, quem compoe volta a ser o proprio XFCE, senao nao ha sombra nenhuma
[[passo]]
tipo = "xfconf"
se = "efeitos != sim"
canal = "xfwm4"
chave = "/general/use_compositing"
tipo_valor = "bool"
valor = "true"

[[passo]]
tipo = "apt"
se = "efeitos == sim"
pacotes = ["picom"]

# o modelo escolhe glx na maquina fisica e xrender sem vsync em maquina
# virtual, onde o glx para de redesenhar as janelas
[[passo]]
tipo = "arquivo"
se = "efeitos == sim"
destino = "~/.config/picom.conf"
modelo = "picom.conf"

# os dois compositores juntos causam rasgos de tela
[[passo]]
tipo = "xfconf"
se = "efeitos == sim"
canal = "xfwm4"
chave = "/general/use_compositing"
tipo_valor = "bool"
valor = "false"

[[passo]]
tipo = "autostart"
se = "efeitos == sim"
id = "picom"
nome = "Efeitos de janela"
comando = "picom --config @@HOME@@/.config/picom.conf"

[[passo]]
tipo = "processo"
se = "efeitos == sim"
nome = "picom"
acao = "reiniciar"
argumentos = ["picom", "--config", "@@HOME@@/.config/picom.conf"]
